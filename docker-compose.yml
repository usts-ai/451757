version: '3.8'

services:
  # Service de l'application web
  chronotrack-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronotrack-app
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - chronotrack-network
    # Volumes pour le développement (décommenter si nécessaire)
    # volumes:
    #   - ./src:/app/src
    #   - ./public:/app/public
    environment:
      - NODE_ENV=production

  # Service pour le développement (décommenter si nécessaire)
  # chronotrack-dev:
  #   image: node:20-alpine
  #   container_name: chronotrack-dev
  #   working_dir: /app
  #   command: sh -c "npm install && npm start"
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - .:/app
  #   environment:
  #     - NODE_ENV=development
  #     - CHOKIDAR_USEPOLLING=true
  #   networks:
  #     - chronotrack-network

networks:
  chronotrack-network:
    driver: bridge
