<!DOCTYPE html>

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <meta name="theme-color" content="#3B82F6" />

              'spin-slow': 'spin 3s linear infinite',

          }

      }

    <link rel="preconnect" href="https://fonts.googleapis.com">
